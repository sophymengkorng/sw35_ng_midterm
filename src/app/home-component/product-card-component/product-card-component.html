<div class="card h-100 product-card">
  <div class="card-image-wrap">
    <img [src]="product.image" class="card-img-top p-3" [alt]="product.title" />
  </div>
  <div class="card-body d-flex flex-column mr-auto">
    <span class="card-label">Base set · collectible</span>
    <h5 class="card-title">{{ stringToUpper(product.title) }}</h5>
    <div class="card-footer-row mt-auto">
      <div class="card-cols">
        <p class="card-text fw-bold mb-0">${{ product.price }}</p>
        <p class="card-text fw-bold mb-0">{{ product.price | toKhr }}៛</p>
      </div>
      <a routerLink="/products/{{ product.id }}" class="btn view-button">View Details</a>
    </div>
  </div>
</div>
