<div class="container hero-wrap">
  <div id="carouselExampleInterval" class="carousel slide hero-carousel" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active" data-bs-interval="4000">
        <img
          src="https://lh3.googleusercontent.com/v-xCiSuC-wfd033abL8V3YdI4dw-wcAs9nebYt_Y-STHMNupkyE0G7kiwzYLfCwWxEYNDNlHYOwuH8imqr9CAO0s7hwU-qQn7cM=s0-e365"
          class="d-block w-100"
          alt="Pokemon trading cards collection"
        />
        <div class="carousel-caption text-start">
          <span class="hero-kicker">The collector's shelf</span>
          <h1>Classic cards.<br /><em>New energy.</em></h1>
          <p>Discover timeless favorites for your next collection.</p>
          <a routerLink="/products" class="btn hero-button">Shop the collection <span>→</span></a>
        </div>
      </div>
      <div class="carousel-item" data-bs-interval="4000">
        <img
          src="https://www.pokemon.com/static-assets/content-assets/cms2/img/trading-card-game/_tiles/tcgl/2026/09/15/tcgl-169-en.png"
          class="d-block w-100"
          alt="Pokemon trading card game"
        />
      </div>
      <div class="carousel-item">
        <img
          src="https://media-www.partycity.ca/product/seasonal-gardening/party-city-everyday/party-city-party-supplies-decor/8436444/classic-pokemon-party-game-ba69da74-2e21-4d4c-bfbf-fdbaa8ea8e0f-jpgrendition.jpg"
          class="d-block w-100"
          alt="Classic Pokemon collection"
        />
      </div>
    </div>
    <button
      class="carousel-control-prev"
      type="button"
      data-bs-target="#carouselExampleInterval"
      data-bs-slide="prev"
    >
      <span class="carousel-control-prev-icon" aria-hidden="true"></span
      ><span class="visually-hidden">Previous</span>
    </button>
    <button
      class="carousel-control-next"
      type="button"
      data-bs-target="#carouselExampleInterval"
      data-bs-slide="next"
    >
      <span class="carousel-control-next-icon" aria-hidden="true"></span
      ><span class="visually-hidden">Next</span>
    </button>
  </div>
</div>
